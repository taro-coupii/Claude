<title>All-In One</title>
<style>
:root{
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --panel3:#3a3a3c;
  --arena:#0c0c0e; --arena-hi:#151517;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f5f5f7; --muted:#98989d; --faint:#6e6e73;
  --acc:#0a84ff; --acc-dim:#0060df; --acc2:#64d2ff; --acc2-dim:#0a5f8a;
  --neon:#bf5af2; --neon-dim:#7d3aa0; --red:#ff453a;
  --paper:#ffffff; --ink:#1d1d1f;
  --good:#30d158; --warn:#ff9f0a; --bad:#ff453a;
  --glow-acc:0 0 0 1px rgba(10,132,255,.55),0 6px 22px rgba(10,132,255,.20);
  --glow-neon:0 0 0 1px rgba(191,90,242,.55),0 6px 22px rgba(191,90,242,.20);
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 4px 16px rgba(0,0,0,.5);
  --ease:cubic-bezier(.32,.72,0,1);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:980px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--font);margin:0;font-weight:600;letter-spacing:-.022em}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--r-s);letter-spacing:-.01em;
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
button:disabled{opacity:.32;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.stat{font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}

/* ---- layout ---- */
#app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:11px 20px;
  background:rgba(20,20,22,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:12}
header h1{font-size:17px;color:var(--text);white-space:nowrap}
header h1 .one{color:var(--acc)}
header .sub{color:var(--muted);font-size:12px}
header .spacer{flex:1}
header button{background:var(--panel2);color:var(--text);padding:6px 14px;font-size:13px;border-radius:var(--r-pill)}
header button:hover{background:var(--panel3)}
#main{flex:1;min-height:0}
#tableWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;min-width:0;overflow-x:hidden}
#coach{width:340px;flex-shrink:0;border-left:1px solid var(--line);background:#0a0a0b;display:flex;flex-direction:column}
@media(max-width:900px){#main{flex-direction:column}#coach{width:auto;border-left:none;border-top:1px solid var(--line)}}

/* ---- table ---- */
#table{position:relative;flex:1;width:100%;max-width:1040px;min-height:430px;max-height:min(72vh,620px);border-radius:26px;margin:10px auto;
  background:radial-gradient(120% 90% at 50% 0%,var(--arena-hi),var(--arena) 60%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh2)}
#table::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(58% 46% at 50% 42%,rgba(10,132,255,.055),transparent 70%)}
#table::after{content:none}
#potLine{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center}
#potLine .lbl{font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:500}
#potLine .amt{font-size:40px;color:var(--text);font-weight:300;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1.1;transition:transform .3s var(--ease)}
#potLine .amt.bump{transform:scale(1.1)}
#potLine .stack{display:flex;gap:3px;justify-content:center;margin-top:7px;height:5px}
#potLine .stack i{width:16px;height:4px;border-radius:99px;background:var(--panel3)}
#potLine .stack i:nth-child(2){background:var(--acc-dim)}
#potLine .stack i:nth-child(3){background:var(--acc)}
#stageLbl{position:absolute;left:50%;top:61%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:500}
#board{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:8px;align-items:center;z-index:3}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
  background:rgba(28,28,30,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line2);border-radius:var(--r-l);padding:16px 30px;text-align:center;box-shadow:var(--sh2);
  animation:pop .3s var(--ease)}
#banner .t{font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
#banner .s{font-size:12px;color:var(--muted);margin-top:3px}

.seat{position:absolute;width:132px;transform:translate(-50%,-50%);text-align:center;z-index:1}
.seat .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 9px;
  box-shadow:var(--sh1);transition:box-shadow .25s var(--ease),border-color .25s var(--ease)}
.seat.active .box{border-color:transparent;box-shadow:var(--glow-acc)}
.seat.win .box{border-color:transparent;box-shadow:0 0 0 1px var(--acc),0 8px 30px rgba(10,132,255,.35)}
.seat.folded{opacity:.34}
.seat .nm{font-size:13px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .archTag{font-size:10px;color:var(--muted);background:var(--panel2);border-radius:var(--r-pill);
  display:block;padding:1px 8px;margin:3px auto 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;width:fit-content}
.seat .chips{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
.seat .act{font-size:11px;color:var(--muted);min-height:15px;line-height:1.4}
.seat .cards{display:flex;gap:4px;justify-content:center;margin-top:5px;min-height:46px}
.seat .betchip{font-size:11px;color:var(--muted);min-height:16px}
.seat .betchip b{color:var(--warn);font-weight:600}
.dealerBtn{display:inline-block;background:var(--paper);color:var(--ink);border-radius:50%;
  width:16px;height:16px;line-height:16px;font-size:9px;font-weight:700;margin-left:5px;vertical-align:1px}

.card{width:34px;height:46px;border-radius:6px;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;
  box-shadow:var(--sh1);font-size:15px;line-height:1;letter-spacing:-.02em;
  animation:deal .3s var(--ease) backwards}
@keyframes deal{from{opacity:0;transform:translateY(-10px)}}
#board .card:nth-child(2){animation-delay:.05s}#board .card:nth-child(3){animation-delay:.1s}
#board .card:nth-child(4){animation-delay:.05s}#board .card:nth-child(5){animation-delay:.05s}
.card .st{font-size:13px;margin-top:1px}
.card.redsuit{color:#d1202f}
.card.back{background:linear-gradient(160deg,#3f4450,#2a2e38);border:1px solid rgba(255,255,255,.22);position:relative}
.card.back::after{content:"";position:absolute;inset:6px;border-radius:3px;border:1px solid rgba(255,255,255,.20)}
.card.big{width:48px;height:66px;font-size:20px;border-radius:8px}
.card.big .st{font-size:17px}

/* ---- action bar ---- */
#actions{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#0a0a0b;
  border-top:1px solid var(--line);flex-wrap:wrap;min-height:68px}
#actions .info{font-size:13px;color:var(--muted);margin-right:auto}
.abtn{padding:11px 22px;font-size:15px;font-weight:600;border-radius:var(--r-pill);letter-spacing:-.015em}
.abtn:not(:disabled):active{transform:scale(.97)}
.abtn.fold{background:var(--panel2);color:var(--text)}
.abtn.fold:hover{background:var(--panel3)}
.abtn.check,.abtn.call{background:var(--acc);color:#fff}
.abtn.check:hover,.abtn.call:hover{background:#3d9bff}
.abtn.raise{background:var(--paper);color:var(--ink)}
.abtn.raise:hover{background:#e4e4e8}
.abtn.advice{background:transparent;color:var(--acc);font-weight:500;padding:11px 14px}
.abtn.advice:hover{background:rgba(10,132,255,.12)}
#raiseCtl{display:flex;align-items:center;gap:10px}
#raiseCtl input[type=range]{accent-color:var(--acc);width:140px}
#raiseAmt{width:74px;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-s);padding:8px;text-align:right;font-family:inherit}
#raiseCtl .quick{display:flex;gap:5px}
#raiseCtl .quick button{background:var(--panel2);color:var(--muted);font-size:12px;padding:7px 11px;border-radius:var(--r-pill)}
#raiseCtl .quick button:hover{background:var(--panel3);color:var(--text)}

/* ---- equity meter ---- */
#eqBar{position:relative;height:26px;background:var(--panel);border-top:1px solid var(--line);overflow:hidden}
#eqBar .fill{height:100%;width:0;background:var(--acc);opacity:.28;transition:width .45s var(--ease)}
#eqBar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text);display:none}
#eqBar .lab{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 18px;font-size:12px;color:var(--text)}
#eqBar .lab b{font-weight:600}
#eqBar .lab .need{color:var(--muted)}

/* ---- table talk ---- */
.seat .talk{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  font-size:11px;padding:5px 10px;border-radius:var(--r-m);max-width:150px;width:max-content;
  text-align:center;box-shadow:var(--sh2);animation:pop .25s var(--ease)}
.seat .talk::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--panel2);border-bottom:none}
@keyframes pop{from{opacity:0;transform:translate(-50%,-92%) scale(.96)}}

/* ---- coach panel ---- */
#coach .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#coach .hd h2{font-size:15px;color:var(--text)}
#coach .hd label{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
#coachBody{padding:16px 18px;overflow-y:auto;flex:1;font-size:13px;line-height:1.7}
#coachBody .empty{color:var(--muted)}
.advCard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-bottom:12px}
.advCard .rec{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--acc);margin-top:2px}
.advCard .stats{display:flex;gap:18px;margin:10px 0}
.advCard .stats div{font-size:15px;font-weight:500}
.advCard .stats div span{display:block;color:var(--muted);font-size:11px;font-weight:400}
.advCard .why{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;color:var(--text)}
#trend{padding:12px 18px;border-top:1px solid var(--line)}
#trend .tHead{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
#trend .tHead span{font-size:11px;color:var(--muted)}
#trend .tHead b{font-size:22px;font-weight:300;letter-spacing:-.04em;color:var(--text);font-variant-numeric:tabular-nums}
#trend .tHead small{color:var(--faint);font-size:11px}
#log{padding:10px 18px;border-top:1px solid var(--line);max-height:132px;overflow-y:auto;
  font-size:12px;color:var(--faint);line-height:1.75}

/* ---- modals ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:26px 28px;
  max-width:600px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sh2)}
.modal h2{color:var(--text);font-size:22px;margin-bottom:16px}
.modal h3{font-size:13px!important;color:var(--muted)!important;font-weight:500;
  margin-top:22px!important;margin-bottom:6px;letter-spacing:0}
.modal .row{display:flex;align-items:center;gap:12px;margin:12px 0}
.modal .row label{width:150px;color:var(--muted);font-size:13px}
.modal input[type=range]{flex:1;accent-color:var(--acc)}
.modal select,.modal input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-s);padding:8px 11px;font-family:inherit;font-size:13px}
.modal .primary{background:var(--acc);color:#fff;font-weight:600;font-size:16px;
  padding:13px 26px;margin-top:18px;border-radius:var(--r-pill);width:100%;
  position:sticky;bottom:-26px;box-shadow:0 -14px 24px 14px var(--panel)}
.modal .primary:hover{background:#3d9bff}
.chkrow{display:flex;gap:10px;align-items:flex-start;margin:12px 0;color:var(--text);font-size:13px}
.chkrow input{margin-top:3px;accent-color:var(--acc);width:16px;height:16px}
.chkrow small{display:block;color:var(--muted);margin-top:1px;line-height:1.6}
.rvItem{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px;background:var(--panel2)}
.rvItem .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rvItem .street{font-size:11px;color:var(--muted)}
.rvItem .verdict{margin-left:auto;font-weight:600}
.rvItem .verdict.ok{color:var(--good)}.rvItem .verdict.ng{color:var(--bad)}.rvItem .verdict.so{color:var(--warn)}
.rvItem .why{margin-top:8px;color:var(--muted);line-height:1.7;font-size:13px}

/* ---- app shell / tabs (segmented control) ---- */
#tabs{display:flex;gap:2px;background:var(--panel);border-radius:var(--r-s);padding:2px}
#tabs .tab{background:transparent;color:var(--muted);font-size:13px;font-weight:500;padding:5px 13px;border-radius:8px}
#tabs .tab:hover{color:var(--text)}
#tabs .tab.on{background:var(--panel3);color:var(--text);font-weight:600;box-shadow:var(--sh1)}
header #soundBtn{padding:6px 11px;font-size:13px;line-height:1.4}
.view{display:none}
.view.on{display:flex}
#main.view.on{display:flex}
.pane{flex-direction:column;flex:1;min-height:0;overflow-y:auto;padding:28px 30px;gap:20px}
.pane h2{font-size:26px;letter-spacing:-.03em}
.pane h2 + .sub2{color:var(--muted);font-size:13px;margin-top:-14px;max-width:660px;line-height:1.7}
.pane .empty{color:var(--muted);font-size:13px;line-height:1.75}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px}
.card2 h3{font-size:15px;color:var(--text);margin-bottom:12px}
.gbtn{background:var(--panel2);color:var(--text);padding:8px 15px;font-size:13px;font-weight:500;border-radius:var(--r-pill)}
.gbtn:not(:disabled):hover{background:var(--panel3)}
.gbtn.pri{background:var(--acc);color:#fff;font-weight:600}
.gbtn.pri:not(:disabled):hover{background:#3d9bff}
select.gsel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-s);padding:8px 11px;font-size:13px;font-family:inherit}

/* ---- replay ---- */
#rpStage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px;border-radius:var(--r-l);
  background:radial-gradient(120% 90% at 50% 0%,var(--arena-hi),var(--arena) 60%);border:1px solid var(--line)}
#rpBoard{display:flex;gap:8px;min-height:66px;align-items:center}
#rpSeats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.rpSeat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:9px 13px;min-width:118px;text-align:center;font-size:12px}
.rpSeat.act{border-color:transparent;box-shadow:var(--glow-acc)}
.rpSeat.fold{opacity:.34}
.rpSeat .h{display:flex;gap:4px;justify-content:center;margin-top:5px}
.rpSeat b{font-weight:600;font-variant-numeric:tabular-nums}
#rpCtl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#rpCtl input[type=range]{flex:1;min-width:180px;accent-color:var(--acc)}
#rpNarr{padding:14px 18px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-m);font-size:13px;line-height:1.75;color:var(--muted)}
#rpNarr b{color:var(--text)}
#rpNarr .you{color:var(--acc);font-weight:600}

/* ---- stats ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:36px;font-weight:300;letter-spacing:-.045em;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0 4px}
.tile .n{font-size:11px;color:var(--faint);line-height:1.55}
.tile.warn .v{color:var(--warn)}.tile.bad .v{color:var(--bad)}.tile.good .v{color:var(--good)}
.barRow{display:grid;grid-template-columns:88px 1fr 66px;gap:12px;align-items:center;margin:9px 0;font-size:13px}
.barRow .track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.barRow .bar{height:100%;border-radius:99px;background:var(--acc)}
.barRow .bar.loss{background:var(--bad)}
.barRow .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
table.lk{width:100%;border-collapse:collapse;font-size:13px}
table.lk th,table.lk td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.lk tr:last-child td{border-bottom:none}
table.lk th{color:var(--muted);font-weight:500;font-size:12px}
table.lk td.r{text-align:right;font-variant-numeric:tabular-nums}

/* ---- drill ---- */
#drSpot{display:flex;flex-direction:column;gap:20px;align-items:center;padding:32px 24px;border-radius:var(--r-l);
  background:radial-gradient(120% 90% at 50% 0%,var(--arena-hi),var(--arena) 60%);border:1px solid var(--line)}
#drSpot .ctx{color:var(--muted);font-size:13px;text-align:center;line-height:1.8}
#drSpot .ctx b{color:var(--text);font-weight:600}
#drCards{display:flex;gap:18px;align-items:center}
#drCards .grp{display:flex;gap:7px}
#drCards .sep{color:var(--faint);font-size:11px;letter-spacing:.12em}
#drBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#drFb{border-radius:var(--r-l);padding:18px 20px;font-size:13px;line-height:1.75;
  border:1px solid var(--line);background:var(--panel);color:var(--muted)}
#drFb.ok{border-color:rgba(48,209,88,.45)}#drFb.so{border-color:rgba(255,159,10,.45)}#drFb.ng{border-color:rgba(255,69,58,.45)}
#drFb .verdict{font-size:19px;font-weight:600;letter-spacing:-.02em}
#drFb b{color:var(--text)}
#drFb.ok .verdict{color:var(--good)}#drFb.so .verdict{color:var(--warn)}#drFb.ng .verdict{color:var(--bad)}

/* ---- range chart (single-hue sequential) ---- */
#rcGrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;max-width:680px}
#rcGrid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:10px;border-radius:5px;font-weight:600;letter-spacing:-.02em}
.t4{background:#0a84ff;color:#fff}
.t3{background:#0b62bd;color:#fff}
.t2{background:#0d4680;color:#cfe4ff}
.t1{background:#12304f;color:#8fb6d8}
.t0{background:#1c1c1e;color:#6e6e73}
.rcLegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;align-items:center;color:var(--muted)}
.rcLegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* ---- ledger ---- */
.lgGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lgP{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;
  display:flex;flex-direction:column;gap:10px}
.lgP .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.lgP .nm input{background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--text);
  font:inherit;font-weight:600;width:100%;padding:3px 0}
.lgP .nm input:focus{outline:none;border-bottom-color:var(--acc)}
.lgP .net{font-size:30px;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}

<script>
"use strict";
/* ================= cards & evaluation ================= */
const SUITS=["♠","♥","♦","♣"], RANKS="23456789TJQKA";
const RNAME={T:"10",J:"J",Q:"Q",K:"K",A:"A"};
function newDeck(){const d=[];for(let r=0;r<13;r++)for(let s=0;s<4;s++)d.push({r,s});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}return d;}
function cardStr(c){return (RNAME[RANKS[c.r]]||RANKS[c.r])+SUITS[c.s];}

// 5-card evaluator → comparable array [cat, kickers...]
function eval5(cs){
  const rs=cs.map(c=>c.r).sort((a,b)=>b-a);
  const flush=cs.every(c=>c.s===cs[0].s);
  let straightHi=-1;
  const uniq=[...new Set(rs)];
  if(uniq.length===5){
    if(uniq[0]-uniq[4]===4)straightHi=uniq[0];
    else if(uniq[0]===12&&uniq[1]===3)straightHi=3; // wheel A-5
  }
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const groups=Object.entries(cnt).map(([r,c])=>[c,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  if(flush&&straightHi>=0)return[8,straightHi];
  if(groups[0][0]===4)return[7,groups[0][1],groups[1][1]];
  if(groups[0][0]===3&&groups[1][0]===2)return[6,groups[0][1],groups[1][1]];
  if(flush)return[5,...rs];
  if(straightHi>=0)return[4,straightHi];
  if(groups[0][0]===3)return[3,groups[0][1],groups[1][1],groups[2][1]];
  if(groups[0][0]===2&&groups[1][0]===2)return[2,groups[0][1],groups[1][1],groups[2][1]];
  if(groups[0][0]===2)return[1,groups[0][1],groups[1][1],groups[2][1],groups[3][1]];
  return[0,...rs];
}
function cmpRank(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d;}return 0;}
const C7=[];{const idx=[0,1,2,3,4,5,6];for(let a=0;a<3;a++)for(let b=a+1;b<4;b++)for(let c=b+1;c<5;c++)for(let d=c+1;d<6;d++)for(let e=d+1;e<7;e++)C7.push([a,b,c,d,e]);}
function eval7(cs){
  if(cs.length===5)return eval5(cs);
  let best=null;
  for(const combo of C7){
    if(combo[4]>=cs.length)continue;
    const r=eval5(combo.map(i=>cs[i]));
    if(!best||cmpRank(r,best)>0)best=r;
  }
  return best;
}
const CATNAME=["ハイカード","ワンペア","ツーペア","スリーカード","ストレート","フラッシュ","フルハウス","フォーカード","ストレートフラッシュ"];

/* ---- Monte Carlo equity: my hole vs n random opponents ---- */
function equity(hole,board,nOpp,iters){
  iters=iters||300;
  const used=new Set([...hole,...board].map(c=>c.r*4+c.s));
  const rest=[];
  for(let r=0;r<13;r++)for(let s=0;s<4;s++){if(!used.has(r*4+s))rest.push({r,s});}
  let win=0,tie=0;
  const need=5-board.length;
  for(let it=0;it<iters;it++){
    // partial shuffle
    const draw=nOpp*2+need;
    for(let i=0;i<draw;i++){const j=i+Math.floor(Math.random()*(rest.length-i));[rest[i],rest[j]]=[rest[j],rest[i]];}
    const fullBoard=board.concat(rest.slice(nOpp*2,nOpp*2+need));
    const my=eval7(hole.concat(fullBoard));
    let beat=true,tied=false;
    for(let o=0;o<nOpp;o++){
      const oe=eval7([rest[o*2],rest[o*2+1]].concat(fullBoard));
      const d=cmpRank(my,oe);
      if(d<0){beat=false;tied=false;break;}
      if(d===0)tied=true;
    }
    if(beat){if(tied)tie++;else win++;}
  }
  return (win+tie*0.5)/iters;
}

/* ================= game state ================= */
const CPU_NAMES=["ケンジ","ミホ","タツヤ","アキラ","サユリ","ゴロウ","ナナ","レイジ"];
const ARCHS=[
 {name:"標準的",hint:"教科書通りのバランス型。特別な癖はありません",tight:.85,aggr:.8,noise:1,bluff:1,station:0,flow:0},
 {name:"堅実",hint:"参加レンジが狭く、レイズはほぼ本物。逆に降ろされやすいのでブラフが効きます",tight:1.1,aggr:.55,noise:.6,bluff:.3,station:0,flow:0},
 {name:"アグレッシブ",hint:"広く参加して頻繁にレイズ・ブラフ。レイズはやや割り引いてよいですが、ぶつかるなら強い手で",tight:.6,aggr:1.35,noise:1.2,bluff:2.2,station:0,flow:0},
 {name:"数字至上主義",hint:"オッズに忠実で気まぐれゼロ。オッズに合わない支払いは絶対にしないので、この人のコールは常に根拠があります",tight:.95,aggr:.9,noise:.15,bluff:.4,station:0,flow:0},
 {name:"場の流れ重視",hint:"連勝中は強気に、負け込むと弱気に。直近の勝ち負けを見れば次の出方が読めます",tight:.85,aggr:.9,noise:1.4,bluff:1.1,station:0,flow:1},
 {name:"コーリングステーション",hint:"とにかく降りません。ブラフは通じませんが、バリューベットはたっぷり払ってくれます",tight:.7,aggr:.4,noise:.8,bluff:.4,station:1,flow:0},
];
let G=null;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function newGame(nCpu,stack,sb,autoAdv,review,rules){
  const players=[{name:"あなた",human:true,chips:stack,out:false}];
  const deck=[...ARCHS].sort(()=>Math.random()-.5); // random archetype deal, repeats after 6
  for(let i=0;i<nCpu;i++){
    const arch=deck[i%deck.length];
    players.push({name:CPU_NAMES[i],human:false,chips:stack,out:false,startStack:stack,
      arch,tight:arch.tight+(Math.random()*.1-.05),aggr:arch.aggr});
  }
  G={players,sb,bb:sb*2,button:Math.floor(Math.random()*players.length),handNo:0,
     autoAdv,review,records:[],busy:false,rules:rules||{},rakeTotal:0,
     showArch:$("setShowArch").checked};
  players.forEach(p=>{p.streak=0;p.standing=!!G.rules.standup;});
  G.standupActive=!!G.rules.standup;
  if(G.standupActive)logMsg("スタンドアップゲーム開始!ポットを取った人から着席です。");
  $("autoAdvice").checked=autoAdv;
  renderTrend();
  startHand();
}

function alivePlayers(){return G.players.filter(p=>!p.out);}

function startHand(){
  const alive=alivePlayers();
  if(G.players[0].out){endGame(false);return;}
  if(alive.length===1){endGame(true);return;}
  G.handNo++;G.records=[];G.handActs=[];
  G.deck=newDeck();G.board=[];G.pot=0;G.stage=0;
  G.players.forEach(p=>{p.hole=null;p.bet=0;p.total=0;p.folded=p.out;p.allIn=false;p.lastAct="";});
  // move button to next alive
  do{G.button=(G.button+1)%G.players.length;}while(G.players[G.button].out);
  alive.forEach(p=>{p.hole=[G.deck.pop(),G.deck.pop()];});
  // blinds
  const sbi=nextAlive(G.button),bbi=nextAlive(sbi);
  postBet(G.players[sbi],Math.min(G.sb,G.players[sbi].chips));
  postBet(G.players[bbi],Math.min(G.bb,G.players[bbi].chips));
  G.players[sbi].lastAct="SB "+G.players[sbi].bet;
  G.players[bbi].lastAct="BB "+G.players[bbi].bet;
  G.currentBet=G.bb;G.minRaise=G.bb;
  G.toAct=nextAlive(bbi);
  G.lastAggressor=bbi;G.actedCount=0;
  G.players.forEach(p=>p.win=false);
  G._seenBoard=0;G._holeAnim=0;G.frames=[];G.heroPre={vpip:false,pfr:false};
  G.players.forEach(q=>q.talk=null);
  sfx("deal");
  clearCoach();
  logMsg(`── ハンド #${G.handNo} ──`);
  render();
  G._holeAnim=G.handNo;
  loop();
}
function nextAlive(i){do{i=(i+1)%G.players.length;}while(G.players[i].out||G.players[i].folded);return i;}
function postBet(p,amt){amt=Math.min(amt,p.chips);p.chips-=amt;p.bet+=amt;p.total+=amt;G.pot+=amt;if(p.chips===0)p.allIn=true;}

function activeNotAllIn(){return G.players.filter(p=>!p.folded&&!p.out&&!p.allIn);}
function activeCount(){return G.players.filter(p=>!p.folded&&!p.out).length;}

async function loop(){
  if(G.busy)return;G.busy=true;
  try{
    while(true){
      if(activeCount()===1){await awardUncontested();return;}
      // betting round done?
      const need=activeNotAllIn();
      const settled=need.every(p=>p.bet===G.currentBet)&&G.actedCount>=need.length;
      if(need.length<=1&&settled||settled){
        if(G.stage===3||activeNotAllIn().length<=1&&allBetsMatched()){ // maybe run out board
          if(G.stage===3){await showdown();return;}
          if(activeNotAllIn().length<=1){await runOutBoard();return;}
        }
        advanceStage();
        continue;
      }
      const p=G.players[G.toAct];
      if(p.folded||p.out||p.allIn){G.toAct=nextAlive(G.toAct);continue;}
      render();
      if(p.human){await humanTurn(p);}else{await cpuTurn(p);}
      G.actedCount++;
      G.toAct=nextAlive(G.toAct);
    }
  }finally{G.busy=false;}
}
function allBetsMatched(){return G.players.filter(p=>!p.folded&&!p.out&&!p.allIn).every(p=>p.bet===G.currentBet);}
function advanceStage(){
  G.players.forEach(p=>{p.bet=0;if(!p.folded&&!p.out&&!p.allIn)p.lastAct="";});
  G.currentBet=0;G.minRaise=G.bb;G.actedCount=0;
  G.stage++;
  if(G.stage===1)G.board.push(G.deck.pop(),G.deck.pop(),G.deck.pop());
  else G.board.push(G.deck.pop());
  G.toAct=nextAlive(G.button);
  logMsg(["","フロップ","ターン","リバー"][G.stage]+": "+G.board.map(cardStr).join(" "));
  pushFrame(null,null);sfx("deal");
  render();
}
async function runOutBoard(){
  while(G.stage<3){await sleep(600);advanceStage();}
  await showdown();
}

/* ---- actions ---- */
function applyAction(p,act,amt){
  const facing=G.currentBet>p.bet;
  if(act==="fold"){p.folded=true;p.lastAct="フォールド";}
  else if(act==="check"){p.lastAct="チェック";}
  else if(act==="call"){const d=G.currentBet-p.bet;postBet(p,d);p.lastAct=p.allIn?"オールイン":"コール "+G.currentBet;}
  else if(act==="raise"){ // amt = raise-to total
    const prev=G.currentBet;
    postBet(p,amt-p.bet);
    if(p.bet>prev){
      G.minRaise=Math.max(G.minRaise,p.bet-prev);G.currentBet=p.bet;G.actedCount=0;
      p.lastAct=(prev===0?"ベット ":"レイズ ")+p.bet+(p.allIn?" (オールイン)":"");
    }else{ // all-in for less than a raise: it's a call, not a raise
      act=prev>0?"call":"check";
      p.lastAct=p.allIn?"オールイン(コール)":"コール "+p.bet;
    }
  }
  G.handActs.push({p,stage:G.stage,act,facing});
  p.nActs=(p.nActs||0)+1;if(act==="raise")p.nRaises=(p.nRaises||0)+1;
  pushFrame(p,act);
  sfx(act==="fold"?"fold":act==="raise"?"raise":"chip");
  if(!p.human)sayLine(p,act,facing);
  logMsg(`${p.name}: ${p.lastAct||act}`);
}
function pushFrame(actor,act){
  if(!G.frames)return;
  G.frames.push({stage:G.stage,board:G.board.map(cardStr),pot:G.pot,
    actor:actor?actor.name:null,act:act||null,text:actor?actor.lastAct:"",
    seats:G.players.filter(q=>!q.out).map(q=>({name:q.name,chips:q.chips,bet:q.bet,folded:q.folded,
      hole:q.hole?q.hole.map(cardStr):null,human:!!q.human}))});
}

/* ---- house rules helpers ---- */
function openCapActive(){return G.rules.openCap&&G.stage===0&&G.currentBet===G.bb;}
function raiseLimits(p){
  let minTo=Math.min(G.currentBet+G.minRaise,p.bet+p.chips),maxTo=p.bet+p.chips;
  if(openCapActive()){ // open raise: 2BB–5BB (reraises uncapped)
    maxTo=Math.min(maxTo,G.bb*5);
    minTo=Math.min(minTo,maxTo);
  }
  return[minTo,maxTo];
}
function transfer(from,to,amt,why){
  amt=Math.min(amt,from.chips);
  if(amt<=0)return;
  from.chips-=amt;to.chips+=amt;
  logMsg(`【${why}】${from.name} → ${to.name} に ${amt} 支払い`);
}
function isRank(c,ch){return RANKS[c.r]===ch;}
function applyHouseRules(winners){
  const u=G.sb*10; // "$10" scaled to blinds
  const others=p=>G.players.filter(q=>q!==p&&!q.out);
  const winnerSet=new Set(winners);
  // streak counters

      others(w).forEach(o=>transfer(o,w,u,`${w.streak}連続ボーナス`));

        last.standing=false;G.standupActive=false;
      }
    }
  }
}

/* ---- CPU AI ---- */
async function cpuTurn(p){
  await sleep(500+Math.random()*700);
  const toCall=Math.min(G.currentBet-p.bet,p.chips);
  const rand=Math.random();
  const A=p.arch;
  // 場の流れ重視: winning streak emboldens, a beaten-down stack cows
  const flowAdj=A.flow?Math.min(p.streak,3)*.7-(p.chips<p.startStack*.6?1:0):0;
  if(G.stage===0){
    // preflop: Chen-tier ranges, loosened for loose personalities
    const eff=chenScore(p.hole)+(1-p.tight)*3+(rand-.5)*A.noise+flowAdj;
    const openRaised=G.currentBet>G.bb;
    const priceBB=toCall/G.bb;
    const[mn,mx]=raiseLimits(p);
    const rSize=Math.random(),rPlay=Math.random(); // independent draws: sizing / play choice
    const openTo=Math.min(mx,Math.max(mn,Math.round(G.bb*(2.5+rSize*1.5))));
    const threebet=Math.min(p.bet+p.chips,Math.max(G.currentBet+G.minRaise,Math.round(G.currentBet*(2.5+rSize))));
    if(eff>=9.5){
      if(!openRaised)applyAction(p,"raise",openTo);
      else if(rPlay<.55*p.aggr&&p.chips>toCall)applyAction(p,"raise",threebet);
      else applyAction(p,"call");
    }else if(eff>=7.5){
      if(!openRaised)applyAction(p,"raise",openTo);
      else if(priceBB<=8)applyAction(p,"call");
      else applyAction(p,"fold");
    }else if(eff>=5.5){
      if(toCall<=0)applyAction(p,rPlay<.35*p.aggr?"raise":"check",openTo);
      else if(!openRaised)applyAction(p,"call");
      else if(priceBB<=4)applyAction(p,"call");
      else applyAction(p,"fold");
    }else{
      if(toCall<=0)applyAction(p,"check");
      else if(priceBB<=1&&rand<.6)applyAction(p,"call");
      else applyAction(p,"fold");
    }
    render();return;
  }
  const opp=activeCount()-1;
  const eq=equity(p.hole,G.board,Math.min(opp,3),200);
  const potOdds=toCall>0?toCall/(G.pot+toCall):0;
  const strength=eq*p.tight+(rand*.08-.04)*A.noise+flowAdj*.04;
  if(toCall<=0){
    if(strength>0.55||rand<.12*p.aggr*A.bluff){
      const[mn,mx]=raiseLimits(p);
      const to=Math.max(mn,Math.min(mx,Math.max(G.bb*2,Math.round(G.pot*(.5+.3*rand)))));
      applyAction(p,"raise",to);
    }else applyAction(p,"check");
  }else{
    if(strength>potOdds+0.25&&rand<.5*p.aggr&&p.chips>toCall){
      const[mn,mx]=raiseLimits(p);
      const to=Math.max(mn,Math.min(mx,G.currentBet+Math.max(G.minRaise,Math.round(G.pot*.6))));
      applyAction(p,"raise",to);
    }
    else if(strength>potOdds+0.02||toCall<=G.bb&&strength>potOdds-.05)applyAction(p,"call");
    else if(A.station&&strength>potOdds-0.1)applyAction(p,"call"); // calling station won't let go
    else if(rand<.06*p.aggr*A.bluff&&p.chips>toCall*3)applyAction(p,"call"); // occasional float
    else applyAction(p,"fold");
  }
  render();
}

const STAGE_JP=["プリフロップ","フロップ","ターン","リバー"];
function chenScore(h){
  const hi=Math.max(h[0].r,h[1].r),lo=Math.min(h[0].r,h[1].r);
  const val=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  if(hi===lo)return Math.max(5,val(hi)*2);
  let s=val(hi);
  if(h[0].s===h[1].s)s+=2;
  const gap=hi-lo-1;
  s-=gap===0?0:gap===1?1:gap===2?2:gap===3?4:5;
  if(gap<=1&&hi<10)s+=1; // both below Q with 0-1 gap: straight potential
  return Math.ceil(s); // Chen rounds half-points up
}
function holeName(h){
  const hi=Math.max(h[0].r,h[1].r),lo=Math.min(h[0].r,h[1].r);
  const n=r=>RNAME[RANKS[r]]||RANKS[r];
  return hi===lo?n(hi)+n(lo):n(hi)+n(lo)+(h[0].s===h[1].s?"s":"o");
}
const ACT_JP={fold:"フォールド",check:"チェック",call:"コール",raise:"レイズ / ベット"};
function straightOutRanks(all,hole){ // ranks completing a straight that uses >=1 hole card
  const have=new Set(all.map(c=>c.r));
  const outs=new Set();
  for(let add=0;add<13;add++){
    if(have.has(add))continue;
    for(let hi=3;hi<=12;hi++){
      const win=hi===3?[12,0,1,2,3]:[hi-4,hi-3,hi-2,hi-1,hi];
      if(!win.includes(add))continue;
      if(win.every(r=>r===add||have.has(r))&&win.some(r=>r!==add&&hole.some(h=>h.r===r))){outs.add(add);break;}
    }
  }
  return outs.size;
}
function detectDraws(hole,board){
  if(board.length<3||board.length>4)return null;
  const all=hole.concat(board);
  const made=eval7(all)[0];
  const sc=[0,0,0,0];all.forEach(c=>sc[c.s]++);
  let fd=-1;
  for(let s=0;s<4;s++)if(sc[s]===4&&hole.some(h=>h.s===s))fd=s;
  const fOuts=(fd>=0&&made<5)?9:0;
  const sRanks=made>=4?0:straightOutRanks(all,hole);
  const outs=fOuts+sRanks*4-(fd>=0?sRanks:0); // avoid double-counting the flush suit
  if(outs<=0)return null;
  const parts=[];
  if(fOuts)parts.push(`${SUITS[fd]}のフラッシュドロー(9アウツ)`);
  if(sRanks>=2)parts.push(`ストレートドロー・両面級(完成ランク${sRanks}種 ≒ ${sRanks*4}アウツ)`);
  else if(sRanks===1)parts.push(`ガットショットのストレートドロー(4アウツ)`);
  return{outs,desc:parts.join(" + ")};
}
function boardThreats(board){
  if(board.length<3)return[];
  const t=[];const sc=[0,0,0,0];board.forEach(c=>sc[c.s]++);
  const mx=Math.max(...sc),ms=sc.indexOf(mx);
  if(mx>=4)t.push(`ボードに${SUITS[ms]}が4枚 — 相手は${SUITS[ms]}1枚でフラッシュ完成`);
  else if(mx===3)t.push(`ボードに${SUITS[ms]}が3枚 — 相手のフラッシュ完成があり得る`);
  const rs=new Set(board.map(c=>c.r));
  let st=0;
  for(let hi=3;hi<=12;hi++){
    const win=hi===3?[12,0,1,2,3]:[hi-4,hi-3,hi-2,hi-1,hi];
    st=Math.max(st,win.filter(r=>rs.has(r)).length);
  }
  if(st>=4)t.push("ボードのランクが4枚連番圏内 — 相手のストレート完成が濃厚な形");
  else if(st>=3)t.push("ボードに連続したランク — 相手のストレート完成があり得る");
  return t;
}
function computeAdvice(p){
  const opp=activeCount()-1;
  const eq=equity(p.hole,G.board,opp,400);
  const toCall=Math.min(G.currentBet-p.bet,p.chips);
  const fair=1/(opp+1);

  if(handDesc)reasons.push(`現時点の役: ${handDesc}。`);

  // --- draw & board-texture awareness ---
  let draws=null;
  if(G.stage===1||G.stage===2){

  // --- opponent line reads ---
  let raisersNow=0;
  for(const o of G.players.filter(q=>!q.human&&!q.folded&&!q.out)){

    let read;

    else if(preRaise&&postAgg)read="プリフロップから一貫して攻めており、オーバーペアやトップペア以上が中心の強いレンジ";
    else if(preRaise)read="プリフロップレイズ後は静か。AK系の空振りや中ペアの可能性も残る";
    else if(acts.some(a=>a.act==="call"&&a.facing))read="コール主体のライン。中程度のペアやドローが中心で、モンスターは考えにくい";
    else if(acts.length)read="チェック中心の消極的なライン。弱めのレンジを示唆";
    else read="まだ行動情報なし";
    const rr=o.nActs>=8?(o.nRaises||0)/o.nActs:-1;
    const tend=rr<0?"":rr>0.3?"(実際のプレイも攻撃的。レイズをやや割り引いて可)":rr<0.12?"(実際のプレイも慎重。レイズは本物の可能性大)":"";
    if(G.showArch)reasons.push(`🔎 ${o.name}〈${o.arch.name}〉のライン: ${read}${tend}。タイプ的には: ${o.arch.hint}。`);
    else reasons.push(`🔎 ${o.name} のライン: ${read}${tend}。`);
  }
  let effEq=eq;

  }

  // --- house-rule impact ---
  let bonus=0;const others=G.players.filter(q=>q!==p&&!q.out).length;
  const h=p.hole,u=G.sb*10;
  if(G.rules.r27o&&h[0].s!==h[1].s&&((isRank(h[0],"2")&&isRank(h[1],"7"))||(isRank(h[0],"7")&&isRank(h[1],"2")))){
    bonus+=others*u;reasons.push(`🃏 27oゲーム有効: この 2-7o で勝てば全員から ${u} ずつ(計 ${others*u})のボーナス。通常なら即フォールドの紙屑ハンドですが、その分だけ広く戦う価値があります。`);}
  if(G.rules.j5&&((isRank(h[0],"J")&&isRank(h[1],"5"))||(isRank(h[0],"5")&&isRank(h[1],"J")))){

    if(isPair&&cs<8){
      const setPrice=Math.round(effStack*0.06);
      reasons.push(`小〜中のポケットペアは「すでにワンペアがある」強さで戦うハンドではありません。フロップでセットになる確率は約 11.8%(約 7.5 回に 1 回)で、その 1 回で相手のスタックを大きく取ることが利益の源泉です。したがって判断基準はハンドの強さではなく、セットが入った時に取り返せるか(インプライドオッズ)です。目安は「相手の実効スタック ${effStack} の約 5〜6%(=${setPrice})までなら払ってよい」。`);
      if(stackBB<20&&openRaised){
        rec=effEq>potOdds?"call":"fold";
        reasons.push(`ただし実効スタックが約 ${stackBB.toFixed(0)}BB しかなく、セットが入っても取り返す相手のチップが残っていません。この深さではインプライドオッズが働かないので、セット狙いは捨てて「今持っているペアの素の勝率」だけで判断します(短いスタックはショーダウン勝負)。`);
      }else if(!openRaised){
        rec="raise";
        reasons.push(`まだレイズが入っていないので、オープンレイズが標準です。ペアはそれ自体がショーダウンで勝てる手なので、リンプで安く見せるより主導権を握って相手を絞った方が、セットが入らなかった時にも勝ち筋(継続ベットで降ろす)が残ります。`);
      }else if(toCall<=setPrice){
        rec="call";
        reasons.push(`レイズ額 ${toCall} は目安の ${setPrice} 以内なので、セット狙いのコールが正当化されます。フロップでセットにならなければ素直に降りる、という前提での参加です。`);
      }else{
        rec="fold";
        reasons.push(`レイズ額 ${toCall}(実効スタックの ${(toCall/effStack*100).toFixed(0)}%)は、セットが入った時に取り返せる額を超えています。スタックが浅いほどセット狙いは成立しにくく、ここはフォールドが最善です。`);
      }
    }else if(cs>=10){
      rec="raise";
      reasons.push(`AA〜TT・AK・AQ・AJs・KQs 級の最上位ティアです。基本は常にレイズで攻めます(AA/KK/AK はリレイズも積極的に。TT・KQs 級で強烈なリレイズ合戦になったら、そこは慎重に)。コール止まりは相手に安いドローを許すだけ損です。`);
    }else if(cs>=8){
      if(!openRaised){rec="raise";reasons.push(`AQo・ATs・KQo・99 級の強いハンドです。まだレイズが入っていないので、オープンレイズで主導権を握るのが標準です。リンプやコール止まりは弱すぎます。`);}
      else if(priceBB<=8){rec="call";reasons.push(`強いハンドなので、この程度のレイズ(${toCall} = 約${priceBB.toFixed(1)}BB)には少なくともコールで続行すべきです。相手が慎重なタイプでなければリレイズも選択肢です。`);}
      else{rec=effEq>potOdds?"call":"fold";reasons.push(`巨大なレイズ(約${priceBB.toFixed(0)}BB)に対しては相手のレンジがAA/KK級に絞られるため、AQ級でも慎重に。ここは実効勝率とオッズの比較で判断します。`);}
    }else if(cs>=6){
      if(!openRaised){
        if(late){rec="raise";reasons.push(`有望なハンドかつレイトポジション。誰もレイズしていないなら、自らレイズしてブラインドを奪いに行くのが標準です。リンプは相手に無料で反撃の機会を与えます。`);}
        else if(toCall>0){rec="call";reasons.push(`有望なハンドです。アーリー/ミドルからのオープンレイズはやや広すぎるので、安く参加して様子を見るのが無難です(タイトに絞るならフォールドも可)。`);}
        else{rec="check";reasons.push(`有望ですが決定打に欠けるため、無料で見られるならチェックで十分です。`);}
      }
      else if(priceBB<=5){rec="call";reasons.push(`スーテッドコネクタや中ペア級は、安いレイズ(≦5BB)ならフロップを見る価値があります(セットやドローでの大勝ち狙い)。`);}
      else{rec="fold";reasons.push(`このクラスのハンドで大きなレイズを追うのは長期的にマイナスです。`);}
    }else if(cs>=5){
      if(!toCall)rec="check";
      else if(priceBB<=2){rec="call";reasons.push(`投機的ハンドですが、ほぼ無料(≦2BB)なら見る価値があります。`);}
      else{rec="fold";reasons.push(`投機的ハンドで${priceBB.toFixed(1)}BBを払う価値はありません。`);}
      if(!toCall)reasons.push(`投機的ハンドです。無料で見られるならチェック、レイズが来たら基本は降ります。`);
    }else{
      if(!toCall){rec="check";reasons.push(`弱いハンドですが無料ならフロップを見ましょう。`);}
      else if(bonus>0&&priceBB<=5){rec="call";reasons.push(`通常なら即フォールドですが、有効なボーナスルールの期待値(約 +${bonus})を考えると、この価格(${toCall})なら参加が正当化されます。`);}
      else if(effEq>potOdds){rec="call";reasons.push(`弱いハンドですがオッズが極端に良い(${poPct}%)ためコールが許容されます。`);}
      else{rec="fold";reasons.push(`弱いハンドで支払う価値がありません。フォールドが最善です。`);}
    }
  }else if(toCall>0){
    reasons.push(`コールに ${toCall} 必要で、ポットは ${G.pot}${bonus?`(ボーナス期待込みで実質約 ${effPot})`:""}。ポットオッズは ${poPct}%。実効勝率がこれを上回ればコールは数学的にプラスです。`);
    if(effEq>potOdds+0.22&&effEq>fair){rec="raise";reasons.push(`実効勝率がポットオッズを大きく上回っています(${(effEq*100).toFixed(1)}% ≫ ${poPct}%)。バリューを取るためレイズが最善です。目安はポットの6〜7割(約 ${Math.round(G.pot*0.65)})の上乗せです。`);}
    else if(effEq>potOdds){rec="call";reasons.push(`実効勝率(${(effEq*100).toFixed(1)}%)がポットオッズ(${poPct}%)を上回るため、コールで期待値プラスです。`);}
    else if(draws&&draws.outs>=8&&effEq>potOdds-0.08){rec="call";reasons.push(`単純なオッズでは僅かに足りません(${(effEq*100).toFixed(1)}% < ${poPct}%)が、${draws.outs}アウツの強いドローがあります。完成した時に相手のスタックから追加で取れる見込み(インプライドオッズ)まで含めればコールが正当化されます。ただしレイズが返ってきたら降ります。`);}
    else{rec="fold";reasons.push(`実効勝率(${(effEq*100).toFixed(1)}%)がポットオッズ(${poPct}%)を下回り、コールは長期的に損失になります。${draws?`ドロー(${draws.outs}アウツ)を考慮しても価格が高すぎます。`:""}フォールドが最善です。`);}
  }else{
    if(effEq>fair+0.15){rec="raise";reasons.push(`平均を大きく上回る勝率です。チェックで無料カードを与えるより、ベットしてポットを育てつつ相手のドローに料金を課すべきです。サイズはポットの5〜7割(約 ${Math.max(G.bb*2,Math.round(G.pot*0.6))})が目安です。`);}
    else if(draws&&draws.outs>=9&&G.stage===1){rec="raise";reasons.push(`役はまだ弱いですが${draws.outs}アウツの強いドローがあります。フロップではセミブラフのベットが標準です: 相手が降りれば即ポット獲得、コールされても高確率で完成が狙える「2つの勝ち筋」を持てます。サイズはポットの5〜6割(約 ${Math.max(G.bb*2,Math.round(G.pot*0.55))})が目安です。`);}
    else if(effEq>fair+0.04){rec="check";reasons.push(`やや有利ですが決定的ではないため、チェックでポットをコントロールするのが無難です。${draws?`ドローもあるためセミブラフの小さなベットも選択肢です。`:"相手が消極的ならブラフ気味の小さなベットも選択肢です。"}`);}
    else{rec="check";reasons.push(`勝率は平均以下です。無料で次のカードを見られるチェックが最善で、ベットしてもより強いハンドしかコールしません。${draws&&draws.outs>=4?`ドロー(${draws.outs}アウツ)は無料で追えるなら追う価値があります。`:""}`);}
  }
  // --- dimensions beyond raw odds: stack depth, fold equity, domination, playability ---
  if(G.stage===0){
    if(stackBB<25)reasons.push(`📐 スタックデプス: 実効スタックは約 ${stackBB.toFixed(0)}BB と浅めです。浅いほどフロップ以降で駆け引きする余地がなく、セット狙いやスーテッドコネクタのような「後で大きく取る」ハンドの価値が下がり、AやKを含む素直に強いハンドの価値が上がります。`);
    else if(stackBB>=80)reasons.push(`📐 スタックデプス: 実効スタックは約 ${stackBB.toFixed(0)}BB と深めです。深いほど後のストリートで大きく取れるため、ポケットペアやスーテッドハンドの伸びしろ(インプライドオッズ)が効いてきます。`);
  }else{
    if(spr<1.5)reasons.push(`📐 SPR ${spr.toFixed(1)}(ポットに対しスタックが浅い): この状況ではもう小細工の余地がなく、「勝負するかしないか」の二択です。トップペア級でもコミットして構いません。`);
    else if(spr>6)reasons.push(`📐 SPR ${spr.toFixed(1)}(ポットに対しスタックが深い): 大きな失敗をしやすい局面です。ワンペア程度で大きなポットを作りに行くと、より強い完成形に払わされる危険(リバースインプライドオッズ)があります。ポットを膨らませすぎない判断が有効です。`);
  }
  if(live.length&&toCall<=0){
    const fePct=(foldEq*100).toFixed(0);
    if(foldEq<.15)reasons.push(`🛡 フォールドエクイティ: 全員が降りる見込みは約 ${fePct}% と低く、ベットしても「降ろして勝つ」筋はほぼ期待できません。ブラフの価値が下がり、勝負するなら純粋にバリュー(強い手で払わせる)に寄せるべき局面です。`);
    else if(foldEq>.35)reasons.push(`🛡 フォールドエクイティ: 全員が降りる見込みは約 ${fePct}% あります。ベットには「降ろして即勝ち」という2本目の勝ち筋があり、役が弱くても仕掛ける価値が上がります。`);
  }
  if(G.stage===0&&G.currentBet>G.bb){
    const hi=Math.max(p.hole[0].r,p.hole[1].r),lo=Math.min(p.hole[0].r,p.hole[1].r),sui=p.hole[0].s===p.hole[1].s;
    const domA=hi===12&&lo<=6&&!sui, domFace=hi>=9&&hi<=11&&lo>=8&&lo<=11&&!sui;
    dominated=domA||domFace;
    if(dominated)reasons.push(`⚠️ リバースインプライドオッズ: ${holeName(p.hole)} はレイズしてくるレンジに対して「ドミネイトされやすい」形です。ペアになっても相手が同じランクの上位キッカーを持っていると、当たった時ほど大きく払わされます。見た目の勝率より実戦価値は低く見積もるべきです。`);
  }
  if(G.stage===0&&pos==="レイトポジション"&&rec!=="fold")reasons.push(`🎯 プレイアビリティ: 全ストリートで最後に行動できるため、相手のアクションを見てから決められます。同じハンドでもアーリーポジションより明確に価値が高く、その分だけ広く戦えます。`);

  // --- exploit layer: adjust for who is actually in the pot ---
  const bluffy=effEq<fair;
  // one adjustment at most, so the reasoning never contradicts itself
  if(dominated&&rec==="call"&&pos!=="レイトポジション"){
    rec="fold";
    reasons.push(`🔁 上のドミネイト懸念を判断に反映します: 先に行動する不利まで抱えてこの形を追うと、当たっても負ける展開が多くなります。同じ ${holeName(p.hole)} でもレイトポジションなら参加できますが、ここはフォールドが最善です。`);
  }else if(rec==="raise"&&bluffy&&toCall<=0&&station.length){
    rec="check";
    reasons.push(`🔁 相手に合わせた修正: ${station.map(q=>q.name).join("・")} は降りないタイプです。役が平均以下のこの手でベットしても降ろせず、コールされて負けるだけになります。ベットはやめてチェックし、当たった時にバリューで払わせる方針に切り替えます(このタイプにはブラフを打たず、強い手で厚くベットするのが最大の搾取)。`);
  }else if(rec==="check"&&!bluffy&&effEq>fair+.02&&station.length&&toCall<=0){
    rec="raise";
    reasons.push(`🔁 相手に合わせた修正: ${station.map(q=>q.name).join("・")} は弱い手でもコールしてきます。通常なら様子見の場面ですが、このタイプ相手には薄いバリューベットが通るため、ベットして薄い利益を積み重ねるのが得です。`);
  }else if(rec==="call"&&foeTight&&effEq<potOdds+.08&&toCall>0){
    rec="fold";
    reasons.push(`🔁 相手に合わせた修正: ${foe.name} は仕掛けてくる頻度が低いタイプで、このベットは本物の可能性が高いです。オッズ上はぎりぎりコールできても、相手のレンジが強い方に偏っている分を引くとマイナスになります。ここは降りるのが正解です。`);
  }else if(rec==="fold"&&foeLoose&&!dominated&&toCall>0&&effEq>potOdds-.07){
    rec="call";
    reasons.push(`🔁 相手に合わせた修正: ${foe.name} は広いレンジで仕掛けてくるタイプです。ランダムな相手を想定した計算ではわずかに足りませんが、相手のレンジに弱い手やブラフが多く混ざる分を戻すとコールが利益になります。`);
  }

  if(rec==="raise"){ // downgrade if raising is impossible for this stack
    const[,mx]=raiseLimits(p);
    if(!(mx>G.currentBet&&p.chips>toCall)){
      rec=toCall>0?"call":"check";
      reasons.push(`本来はレイズしたい局面ですが、スタック的にレイズが成立しないため、実行可能な最善は${toCall>0?"コール(オールイン)":"チェック"}です。`);
    }
  }
  reasons.push(`ポジション: ${pos}。${pos==="レイトポジション"?"後から行動できるため、やや広いレンジで攻められます。":pos==="アーリーポジション"?"先に行動する不利があるため、通常より慎重に。":"標準的な判断で問題ありません。"}`);
  return {rec,eq,effEq,potOdds,toCall,pot:G.pot,reasons};
}
function positionName(idx){
  const n=alivePlayers().length;
  let d=(idx-G.button+G.players.length)%G.players.length;
  if(d===0||d>n*0.66)return"レイトポジション";
  if(d<=Math.max(2,n*0.33))return"アーリーポジション";
  return"ミドルポジション";
}

function recordHandScore(){
  if(!G.records.length)return;
  const s=G.records.reduce((a,r)=>a+({ok:1,so:.5,ng:0}[verdictOf(r.advice.rec,r.action)[0]]),0)/G.records.length;
  TREND.push({n:TREND.length+1,s});saveTrend();renderTrend();
}
function renderTrend(){
  const el=$("trend");
  if(!TREND.length){el.hidden=true;return;}
  el.hidden=false;
  const last=TREND.slice(-20),rec10=TREND.slice(-10);
  const avg=Math.round(rec10.reduce((a,b)=>a+b.s,0)/rec10.length*100);
  const W=280,H=56,P=8;
  const xs=i=>P+(W-2*P)*(last.length===1?.5:i/(last.length-1));
  const ys=v=>H-P-(H-2*P)*v;
  const pts=last.map((d,i)=>[xs(i),ys(d.s)]);
  const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const[ex,ey]=pts[pts.length-1];
  el.innerHTML=`<div class="tHead"><span>判断精度トレンド</span><b class="num">${avg}%</b><small>直近${rec10.length}ハンド平均</small></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="ハンドごとの判断精度(推奨との一致度)の推移。直近${rec10.length}ハンド平均 ${avg}%">
    <line x1="${P}" y1="${ys(.5)}" x2="${W-P}" y2="${ys(.5)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${last.map((d,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(d.s).toFixed(1)}" r="3" fill="var(--acc)"><title>第${d.n}ハンド: ${Math.round(d.s*100)}%</title></circle>`).join("")}
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.5" fill="var(--neon)" stroke="var(--panel)" stroke-width="2"><title>最新: ${Math.round(last[last.length-1].s*100)}%</title></circle>
  </svg>`;
}

function verdictOf(rec,act){
  if(rec===act)return["ok","✓ 最善"];
  const soft=(rec==="raise"&&act==="call")||(rec==="call"&&act==="raise")||(rec==="check"&&act==="raise")||(rec==="raise"&&act==="check");
  if(soft)return["so","△ 許容範囲"];
  return["ng","✗ 要改善"];
}

async function awardUncontested(){
  const w=G.players.find(p=>!p.folded&&!p.out);
  takeRake();
  w.chips+=G.pot;w.win=true;
  logMsg(`${w.name} が ${G.pot} を獲得(全員フォールド)。`);
  applyHouseRules([w]);
  await endHand(`${w.name} の勝ち — 他全員フォールド`);
}
async function showdown(){
  render();
  const contenders=G.players.filter(p=>!p.folded&&!p.out);
  contenders.forEach(p=>p.show=true);
  render();
  // side pots by total contribution
  let rake=G.rules.rake?[0,1,1,2][G.stage]*G.sb:0;
  const results=[];const allWinners=new Set();
  let pool=G.players.filter(p=>p.total>0).map(p=>({p,rem:p.total}));
  while(pool.some(x=>x.rem>0)){
    const inPot=pool.filter(x=>x.rem>0);
    const lvl=Math.min(...inPot.map(x=>x.rem));
    let potAmt=0;
    inPot.forEach(x=>{x.rem-=lvl;potAmt+=lvl;});
    if(rake>0&&potAmt>rake){potAmt-=rake;G.rakeTotal+=rake;logMsg(`ディーラーチップ ${rake} を徴収(累計 ${G.rakeTotal})。`);rake=0;}
    const elig=inPot.map(x=>x.p).filter(p=>!p.folded);
    let best=null,winners=[];
    elig.forEach(p=>{
      const r=eval7(p.hole.concat(G.board));
      p.rank=r;
      if(!best||cmpRank(r,best)>0){best=r;winners=[p];}
      else if(cmpRank(r,best)===0)winners.push(p);
    });
    const share=Math.floor(potAmt/winners.length);
    winners.forEach(w=>w.chips+=share);
    winners[0].chips+=potAmt-share*winners.length;
    winners.forEach(w=>{allWinners.add(w);w.win=true;});
    results.push(`${winners.map(w=>w.name).join("・")} が ${potAmt} を獲得(${CATNAME[best[0]]})`);
  }
  results.forEach(logMsg);
  applyHouseRules([...allWinners]);
  await sleep(400);
  await endHand(results.join(" / "));
}

function sfx(kind){
  if(!SOUND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const spec={deal:[520,.05,.05],chip:[300,.06,.05],raise:[440,.09,.09],fold:[180,.09,.05],win:[660,.22,.10],good:[720,.12,.08],bad:[200,.16,.08]}[kind];
    if(!spec)return;
    const[f,d,v]=spec,t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type="triangle";o.frequency.setValueAtTime(f,t);
    if(kind==="win")o.frequency.exponentialRampToValueAtTime(f*1.6,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function recordDecision(adv,act){
  const[cls]=verdictOf(adv.rec,act);
  // chip EV of a call the coach judged -EV: cost minus equity share of the final pot
  let loss=0;
  if(adv.toCall>0&&(act==="call"||act==="raise")&&adv.rec==="fold"){
    const e=adv.effEq!=null?adv.effEq:adv.eq;
    loss=Math.max(0,adv.toCall-e*(adv.pot+adv.toCall));
  }
  DEC.push({t:Date.now(),stage:G.stage,act,rec:adv.rec,cls,
    eq:+(adv.effEq!=null?adv.effEq:adv.eq).toFixed(4),po:+adv.potOdds.toFixed(4),
    toCall:adv.toCall,pot:adv.pot,loss:+loss.toFixed(2)});
  if(DEC.length>500)DEC=DEC.slice(-500);
  save("poker_dec_v1",DEC);
}
function archiveHand(summary){

    records:G.records.map(r=>({stage:r.stage,action:r.action,amt:r.amt,rec:r.advice.rec,
      cls:verdictOf(r.advice.rec,r.action)[0],reasons:r.advice.reasons}))});
  if(HANDS.length>30)HANDS=HANDS.slice(-30);

}

let DR={spot:null,score:load("poker_drill_v1",{n:0,pts:0})};
function makeSpot(){
  const deck=newDeck();
  const nOpp=1+Math.floor(Math.random()*3);
  const stage=Math.floor(Math.random()*4);
  const hole=[deck.pop(),deck.pop()];
  const board=[];for(let i=0;i<[0,3,4,5][stage];i++)board.push(deck.pop());
  const bb=2,pot=Math.round(bb*(stage===0?1.5+Math.random()*6:6+Math.random()*30));
  const facing=Math.random()<0.65;
  const toCall=facing?Math.max(bb,Math.round(pot*(0.25+Math.random()*0.75))):0;
  const players=[{name:"あなた",human:true,chips:200,bet:0,hole,folded:false,out:false,streak:0,standing:false}];
  for(let i=0;i<nOpp;i++)players.push({name:CPU_NAMES[i],human:false,chips:200,bet:toCall,folded:false,out:false,
    arch:ARCHS[Math.floor(Math.random()*ARCHS.length)],nActs:0,nRaises:0,streak:0,standing:false});
  const fake={players,sb:1,bb,pot,currentBet:toCall,minRaise:bb,stage,board,button:players.length-1,
    rules:{},handActs:[],showArch:false,standupActive:false,handNo:1,records:[],frames:null};
  if(facing)fake.handActs.push({p:players[1],stage,act:Math.random()<0.5?"raise":"call",facing:false});
  const prev=G;G=fake;
  let adv;try{adv=computeAdvice(players[0]);}finally{G=prev;}
  return{hole,board,stage,pot,toCall,nOpp,adv,arch:players[1]?players[1].arch:null,line:facing};
}
function renderDrill(){
  const el=$("v-drill");
  const acc=DR.score.n?Math.round(DR.score.pts/DR.score.n*100):0;
  el.innerHTML=`<h2>判断ドリル</h2>
   <p class="sub2">ランダムな局面が出題されます。実戦より速く場数を踏めるので、プリフロップの基準やポットオッズの感覚を短時間で鍛えられます。</p>
   <div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap">
     <span style="color:var(--muted);font-size:12px">正答率</span><b class="stat" style="font-size:30px">${acc}%</b>
     <span style="color:var(--muted);font-size:12px" class="num">${DR.score.n} 問</span>
     <button class="gbtn" id="drReset" style="margin-left:auto">記録をリセット</button>
   </div>
   <div id="drSpot"></div><div id="drFb" hidden></div>`;
  $("drReset").onclick=()=>{DR.score={n:0,pts:0};save("poker_drill_v1",DR.score);renderDrill();};
  nextSpot();
}
function nextSpot(){
  DR.spot=makeSpot();
  const s=DR.spot;
  $("drFb").hidden=true;
  $("drSpot").innerHTML=`
    <div class="ctx">${STAGE_JP[s.stage]} ／ 相手 ${s.nOpp} 人 ／ ポット <b class="num" style="color:var(--text)">${s.pot}</b> ／ ${s.toCall>0?`コール額 <b class="num" style="color:var(--warn)">${s.toCall}</b>`:"あなたにチェックが回ってきました"}</div>
    <div id="drCards">
      <div class="grp">${s.hole.map(c=>cardHTML(cardStr(c),true)).join("")}</div>
      ${s.board.length?`<span class="sep">BOARD</span><div class="grp">${s.board.map(c=>cardHTML(cardStr(c),true)).join("")}</div>`:""}
    </div>
    <div id="drBtns">
      <button class="abtn fold" data-a="fold">フォールド</button>
      ${s.toCall>0?`<button class="abtn call" data-a="call">コール ${s.toCall}</button>`:`<button class="abtn check" data-a="check">チェック</button>`}
      <button class="abtn raise" data-a="raise">レイズ / ベット</button>
    </div>`;
  $("drSpot").querySelectorAll("#drBtns button").forEach(b=>b.onclick=()=>gradeSpot(b.dataset.a));
}
function gradeSpot(act){
  const s=DR.spot,[cls,lbl]=verdictOf(s.adv.rec,act);
  const pts={ok:1,so:.5,ng:0}[cls];
  DR.score.n++;DR.score.pts+=pts;save("poker_drill_v1",DR.score);
  sfx(cls==="ok"?"good":cls==="ng"?"bad":"chip");
  const fb=$("drFb");fb.hidden=false;fb.className=cls;
  fb.innerHTML=`<div class="verdict">${lbl}</div>
    <div style="margin:6px 0">あなた: <b>${ACT_JP[act]}</b> ／ 推奨: <b style="color:var(--acc2)">${ACT_JP[s.adv.rec]}</b></div>
    <div style="border-top:1px dashed var(--line);padding-top:8px">${s.adv.reasons.map(r=>"・"+r).join("<br>")}</div>
    <button class="gbtn pri" id="drNext" style="margin-top:12px">次の問題 ▶</button>`;
  $("drNext").onclick=()=>{renderDrillScoreOnly();nextSpot();};
}
function renderDrillScoreOnly(){
  const acc=DR.score.n?Math.round(DR.score.pts/DR.score.n*100):0;
  const el=$("v-drill").querySelector("b.stat");if(el)el.textContent=acc+"%";
  const c=$("v-drill").querySelector("span.num");if(c)c.textContent=DR.score.n+" 問";
}

/* ================= 4. starting-hand chart ================= */
function renderChart(){
  const R=["A","K","Q","J","T","9","8","7","6","5","4","3","2"];
  const idx=r=>12-r; // display order high→low
  let cells="";
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){
    const hi=12-Math.min(i,j),lo=12-Math.max(i,j);
    const suited=j>i;
    const hole=[{r:hi,s:0},{r:lo,s:suited?0:1}];
    const cs=chenScore(hole);
    const t=cs>=10?"t4":cs>=8?"t3":cs>=6?"t2":cs>=5?"t1":"t0";
    const nm=(hi===lo)?R[idx(hi)]+R[idx(hi)]:R[idx(hi)]+R[idx(lo)]+(suited?"s":"o");
    cells+=`<div class="${t}" title="${nm} — Chen ${cs}">${nm}</div>`;
  }
  $("v-chart").innerHTML=`<h2>スターティングハンド表</h2>
   <p class="sub2">コーチが使っている Chen スコアのティアを色分けしたものです。対角線がポケットペア、右上がスーテッド、左下がオフスート(T = 10)。色が明るいほど強いティアで、この表がプリフロップ判断の下敷きになっています。</p>
   <div class="rcLegend">
     <span><i class="t4"></i>最上位(Chen 10+) 常にレイズ</span>
     <span><i class="t3"></i>強い(8-9) オープンレイズ / 8BBまでコール</span>
     <span><i class="t2"></i>有望(6-7) 安ければ参加・レイトならスチール</span>
     <span><i class="t1"></i>投機的(5) ほぼ無料なら</span>
     <span><i class="t0"></i>弱い(4以下) 基本フォールド</span>
   </div>
   <div id="rcGrid">${cells}</div>
   <p class="sub2" style="margin-top:4px">※ 実戦ではポジション・相手のタイプ・ハウスルールのボーナスで基準が動きます。表はあくまで出発点です。</p>`;
}

/* ================= 5. home-game ledger ================= */
let LG=load("poker_ledger_v1",null);
function lgInit(){return{buyin:200,unit:"$",bank:0,rake:0,started:Date.now(),lastSeat:Date.now(),
  players:[{name:"あなた",buyins:1,cash:null},{name:"",buyins:1,cash:null}]};}
function lgSave(){save("poker_ledger_v1",LG);}
function lgNet(inp){
  const i=+inp.dataset.cash,p=LG.players[i],net=p.cash==null?null:p.cash-p.buyins*LG.buyin;
  const el=inp.parentElement.querySelector(".net");
  if(!el)return;
  el.textContent=net==null?"—":(net>=0?"+":"")+LG.unit+net;
  el.className="net num "+(net==null?"":net>=0?"plus":"minus");
}
function renderLedger(){
  const el=$("v-ledger");
  if(!LG){el.innerHTML=`<h2>ホームゲーム記帳</h2>
    <p class="sub2">実際の対面ゲーム用の帳簿です。バイイン・リバイ・共有バンク・ディーラーチップ・席替えのタイミングを記録し、終了時の精算まで出します。</p>
    <div><button class="gbtn pri" id="lgStart">記帳を開始</button></div>`;
    $("lgStart").onclick=()=>{LG=lgInit();lgSave();renderLedger();};return;}
  const tot=LG.players.reduce((a,p)=>a+p.buyins*LG.buyin,0);
  const cashed=LG.players.reduce((a,p)=>a+(p.cash||0),0);
  const mins=Math.floor((Date.now()-LG.lastSeat)/60000);
  const elapsed=Math.floor((Date.now()-LG.started)/60000);
  el.innerHTML=`<h2>ホームゲーム記帳</h2>
   <p class="sub2">バイイン ${LG.unit}${LG.buyin} 一律 / リバイは最大2回(合計 ${LG.unit}${LG.buyin*3})。2回目が飛んだ人は共有バンクを受け取って再開できます。</p>
   <div class="card2 lgBank">
     <div><div class="k">共有バンク</div><div class="v num">${LG.unit}${LG.bank}</div>
       <div class="k" style="color:var(--faint)">1口 ${LG.unit}40 まで(${Math.floor(LG.bank/40)}口目)</div></div>
     <div><div class="k">ディーラーチップ累計</div><div class="v num">${LG.unit}${LG.rake}</div></div>
     <div><div class="k">卓上総額</div><div class="v num">${LG.unit}${tot}</div></div>
     <div><div class="k">経過</div><div class="v num">${Math.floor(elapsed/60)}h${elapsed%60}m</div>
       <div style="font-size:11px;color:${mins>=60?"var(--warn)":"var(--muted)"}">席替えから ${mins} 分${mins>=60?" — 席替えできます":""}</div></div>
     <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
       <button class="gbtn" id="lgBank+">バンク +10</button>
       <button class="gbtn" id="lgRake+">チップ +1</button>
       <button class="gbtn" id="lgSeat">席替えした</button>
     </div>
   </div>
   <div class="lgGrid">${LG.players.map((p,i)=>{
     const paid=p.buyins*LG.buyin,net=(p.cash==null?null:p.cash-paid);
     return `<div class="lgP">
       <div class="nm"><input value="${p.name.replace(/"/g,"&quot;")}" placeholder="プレイヤー名" data-nm="${i}"></div>
       <div class="meta">バイイン ${p.buyins} 回 = ${LG.unit}${paid}${p.buyins>=3?" (上限)":""}</div>
       <div class="rowb"><button class="gbtn" data-rb="${i}" ${p.buyins>=3?"disabled":""}>リバイ +${LG.unit}${LG.buyin}</button><button class="gbtn" data-rm="${i}" ${p.buyins<=1?"disabled":""}>−1</button></div>
       <div class="meta">最終スタック(精算時に入力)</div>
       <input class="cash num" type="number" placeholder="—" value="${p.cash==null?"":p.cash}" data-cash="${i}">
       <div class="net num ${net==null?"":net>=0?"plus":"minus"}">${net==null?"—":(net>=0?"+":"")+LG.unit+net}</div>
       <div class="rowb" style="justify-content:flex-end"><button class="gbtn" data-del="${i}" style="flex:0 0 auto;min-width:0">削除</button></div>
     </div>`;}).join("")}</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap">
     <button class="gbtn" id="lgAdd">プレイヤーを追加</button>
     <button class="gbtn" id="lgEnd">精算する</button>
     <button class="gbtn" id="lgReset">記帳をリセット</button>
   </div>
   ${cashed?`<div class="card2"><b style="color:var(--acc)">精算チェック</b>
     <p style="font-size:13px;line-height:1.8;margin-top:6px">入力済みスタック合計 ${LG.unit}${cashed} / 卓上総額 ${LG.unit}${tot}(共有バンク ${LG.unit}${LG.bank}、ディーラーチップ ${LG.unit}${LG.rake} を含む)。
     差額 <b style="color:${cashed+LG.bank+LG.rake===tot?"var(--good)":"var(--warn)"}">${LG.unit}${tot-cashed-LG.bank-LG.rake}</b> が 0 なら計算が合っています。</p></div>`:""}`;
  el.querySelectorAll("[data-nm]").forEach(inp=>inp.onchange=e=>{LG.players[+e.target.dataset.nm].name=e.target.value;lgSave();});
  el.querySelectorAll("[data-cash]").forEach(inp=>{
    const commit=e=>{const v=e.target.value;LG.players[+e.target.dataset.cash].cash=v===""?null:+v;lgSave();lgNet(e.target);};
    inp.oninput=commit;inp.onchange=e=>{commit(e);renderLedger();};
  });
  el.querySelectorAll("[data-rb]").forEach(b=>b.onclick=()=>{LG.players[+b.dataset.rb].buyins++;lgSave();renderLedger();});
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{LG.players[+b.dataset.rm].buyins--;lgSave();renderLedger();});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{LG.players.splice(+b.dataset.del,1);lgSave();renderLedger();});
  $("lgAdd").onclick=()=>{LG.players.push({name:"",buyins:1,cash:null});lgSave();renderLedger();};
  $("lgBank+").onclick=()=>{LG.bank+=10;lgSave();renderLedger();};
  $("lgRake+").onclick=()=>{LG.rake+=1;lgSave();renderLedger();};
  $("lgSeat").onclick=()=>{LG.lastSeat=Date.now();lgSave();renderLedger();};
  $("lgEnd").onclick=()=>{
    const rows=LG.players.map(p=>({n:p.name||"(無名)",net:(p.cash||0)-p.buyins*LG.buyin})).sort((a,b)=>b.net-a.net);
    alert("精算結果\n\n"+rows.map(r=>`${r.n}: ${r.net>=0?"+":""}${LG.unit}${r.net}`).join("\n")+
      `\n\n共有バンク残 ${LG.unit}${LG.bank} / ディーラーチップ ${LG.unit}${LG.rake}\nタイムチャージはホストが立て替え、成績を見て配分してください。`);
  };
  $("lgReset").onclick=()=>{if(confirm("記帳をリセットしますか?")){LG=null;lgSave();renderLedger();}};
}
